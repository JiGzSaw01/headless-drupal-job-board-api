services:
  job_api.job_normalizer:
    class: Drupal\job_api\Service\JobNormalizer

  job_api.featured_jobs_provider:
    class: Drupal\job_api\Service\FeaturedJobsProvider
    arguments:
      - '@entity_type.manager'
      - '@job_api.job_normalizer'

  Drupal\job_api\Service\FeaturedJobsProviderInterface: '@job_api.featured_jobs_provider'

  job_api.job_listing_provider:
    class: Drupal\job_api\Service\JobListingProvider
    arguments:
      - '@entity_type.manager'
      - '@job_api.job_normalizer'

  Drupal\job_api\Service\JobListingProviderInterface: '@job_api.job_listing_provider'

  job_api.job_detail_provider:
    class: Drupal\job_api\Service\JobDetailProvider
    arguments:
      - '@job_api.job_normalizer'

  Drupal\job_api\Service\JobDetailProviderInterface: '@job_api.job_detail_provider'

  job_api.employer_job_creator:
    class: Drupal\job_api\Service\EmployerJobCreator
    arguments:
      - '@entity_type.manager'
      - '@current_user'

  Drupal\job_api\Service\EmployerJobCreatorInterface: '@job_api.employer_job_creator'

  job_api.employer_job_dashboard_provider:
    class: Drupal\job_api\Service\EmployerJobDashboardProvider
    arguments:
      - '@entity_type.manager'
      - '@current_user' 
      - '@job_api.job_normalizer' 

  Drupal\job_api\Service\EmployerJobDashboardProviderInterface: '@job_api.employer_job_dashboard_provider'

  job_api.featured_jobs_controller:
    class: Drupal\job_api\Controller\FeaturedJobsController
    arguments:
      - '@job_api.featured_jobs_provider'

  job_api.job_listing_controller:
    class: Drupal\job_api\Controller\JobListingController
    arguments:
      - '@job_api.job_listing_provider'

  job_api.job_detail_controller:
    class: Drupal\job_api\Controller\JobDetailController
    arguments:
      - '@job_api.job_detail_provider'

  job_api.employer_job_create_controller:
    class: Drupal\job_api\Controller\EmployerJobCreateController
    arguments:
      - '@job_api.employer_job_creator'
      
  job_api.employer_job_dashboard_controller:
    class: Drupal\job_api\Controller\EmployerJobsDashboardController
    arguments:
      - '@job_api.employer_job_dashboard_provider'