job_api.job_listing:
  path: '/api/jobs'
  defaults:
    _controller: 'job_api.job_listing_controller:list'
  requirements:
    _permission: 'access content'
  methods: [GET]

job_api.featured_jobs:
  path: '/api/jobs/featured'
  defaults:
    _controller: 'job_api.featured_jobs_controller:list'
  requirements:
    _permission: 'access content'
  methods: [GET]

job_api.job_detail:
  path: '/api/jobs/{node}'
  defaults:
    _controller: 'job_api.job_detail_controller:view'
  requirements:
    _permission: 'access content'
    node: '\d+'
  options:
    parameters:
      node:
        type: entity:node
  methods: [GET]

job_api.employer_job_create:
  path: '/api/employer/jobs'
  defaults:
    _controller: 'job_api.employer_job_create_controller:create'
  requirements:
    _permission: 'create job content'
  methods: [POST]
